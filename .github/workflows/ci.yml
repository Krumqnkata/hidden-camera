name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff
        run: ruff check .
      - name: Import check
        run: |
          python -c "import hcam.controller, hcam.uploaders, main; print('imports ok')"
          python main.py --help
      - name: Pipeline smoke test (no hardware)
        run: python tests/smoke_test.py
