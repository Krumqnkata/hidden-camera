[project]
name = "hidden-camera"
version = "1.0.0"
description = "Background Motion + Audio security recorder for Windows with Google Drive / Telegram upload"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "ARG"]
# SIM105/SIM108: явните try/except и if/else са по-четими (и по-бързи в аудио callback-а)
ignore = ["SIM105", "SIM108"]
